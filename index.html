<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>파트 이력 관리 시스템</title>
<style>
:root{
  --bg:#f3f5f9; --card:#fff; --line:#d5dbe4; --line2:#e8ecf1; --text:#1f2933; --sub:#64707f;
  --grid:#9aa6b6; --grid-head:#7f8b9c;
  --pri:#2563eb; --pri-d:#1d4ed8; --pri-soft:#e8f0fe;
  --rep:#e3f6ea; --rep-t:#14653a; --cln:#e3edff; --cln-t:#1d4ed8;
  --green:#22c55e; --yellow:#f59e0b; --red:#ef4444; --grey:#9ca3af; --danger:#dc2626;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
button{font-family:inherit;font-size:13px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--text);border-radius:8px;padding:7px 12px;transition:.15s}
button:hover{border-color:#b8c2d0;background:#f8fafc}
button:disabled{opacity:.4;cursor:default}
button.pri{background:var(--pri);border-color:var(--pri);color:#fff}
button.pri:hover{background:var(--pri-d)}
button.danger{background:#fff;border-color:#f3b4b4;color:var(--danger)}
button.danger:hover{background:#fef2f2}
button.sm{padding:4px 9px;font-size:12px}
input,select{font-family:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff;color:var(--text);outline:none}
input:focus,select:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-soft)}

/* ---------- 헤더 ---------- */
header{background:#1e293b;color:#fff;padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:40;box-shadow:0 2px 8px rgba(0,0,0,.15)}
header h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.3px}
.sync{margin-left:auto;display:flex;align-items:center;gap:9px;background:#0f172a;border:1px solid #334155;border-radius:999px;padding:6px 14px 6px 10px;font-size:13px;cursor:pointer;user-select:none;min-width:200px}
.light{display:flex;gap:4px;background:#020617;padding:3px 5px;border-radius:999px}
.light i{width:11px;height:11px;border-radius:50%;background:#334155;display:block;transition:.2s}
.sync[data-s=ok] .light .g{background:var(--green);box-shadow:0 0 7px var(--green)}
.sync[data-s=busy] .light .y{background:var(--yellow);box-shadow:0 0 7px var(--yellow);animation:blink .8s infinite}
.sync[data-s=changed] .light .y{background:var(--yellow);box-shadow:0 0 9px var(--yellow);animation:blink .45s 8}
.sync[data-s=changed]{border-color:var(--yellow)}
.sync[data-s=err] .light .r{background:var(--red);box-shadow:0 0 7px var(--red)}
.sync[data-s=err]{border-color:var(--red)}
.sync[data-s=local] .light i{background:var(--grey)}
@keyframes blink{50%{opacity:.25}}
.hbtn{background:transparent;border-color:#475569;color:#e2e8f0}
.hbtn:hover{background:#334155;border-color:#64748b}

/* ---------- 카테고리 ---------- */
.cats{display:flex;gap:8px;padding:14px 20px 0;flex-wrap:wrap}
.cat{padding:10px 22px;font-size:15px;font-weight:700;border-radius:10px;background:#fff;border:1px solid var(--line);color:#475569;box-shadow:0 1px 0 rgba(0,0,0,.03)}
.cat.on{background:var(--pri);border-color:var(--pri);color:#fff;box-shadow:inset 0 2px 4px rgba(0,0,0,.25);transform:translateY(1px)}
main{padding:14px 20px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}

/* ---------- 설비 선택 ---------- */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar button{font-size:13.5px;font-weight:600}
.toolbar .info{margin-left:auto;color:var(--sub);font-size:12px}
.prcgrp{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:6px 0;border-top:1px dashed var(--line2)}
.prcgrp:first-child{border-top:none}
.prclabel{min-width:74px;font-weight:700;font-size:13px;color:#334155;background:#f1f5f9;border:1px solid var(--line);border-radius:6px;padding:6px 8px;text-align:center}
.prclabel.on{background:#334155;color:#fff;border-color:#334155}
.eqbtn{font-weight:700;min-width:96px;font-size:13.5px}
.eqbtn.on{background:var(--pri);color:#fff;border-color:var(--pri);box-shadow:inset 0 2px 4px rgba(0,0,0,.25)}

/* ---------- 메인 테이블 ---------- */
.tblwrap{overflow-x:auto;border:2px solid var(--grid-head);border-radius:10px;background:#fff}
table.ph{border-collapse:collapse;width:100%;min-width:1000px;font-size:15px;font-weight:600}
table.ph th{background:#e2e8f0;color:#1e293b;font-weight:800;font-size:14.5px;padding:9px 6px;border:1px solid var(--grid-head);white-space:nowrap}
table.ph th.latest-h{background:#fde68a;color:#78350f}
table.ph td{border:1px solid var(--grid);padding:0 8px;height:40px;text-align:center;white-space:nowrap}
table.ph td.eqn{font-weight:800;background:#f1f5f9;font-size:15.5px;color:#0f172a}
table.ph td.area{color:#1e293b;background:#f8fafc;font-weight:700}
table.ph td.item{font-weight:800;color:#0f172a}
table.ph td.in{width:52px;padding:0 4px;background:#fafbff}
.inbtn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:30px;padding:0;border:1.5px solid #93b4f5;background:#eef4ff;color:var(--pri);border-radius:8px}
.inbtn:hover{background:var(--pri);color:#fff;border-color:var(--pri);transform:scale(1.06)}
.inbtn svg{width:20px;height:20px}
table.ph td.d{min-width:88px;font-variant-numeric:tabular-nums;font-size:15px;font-weight:700}
table.ph td.d.rep{background:var(--rep);color:var(--rep-t)}
table.ph td.d.cln{background:var(--cln);color:var(--cln-t)}
table.ph td.d.latest{background:#fff1a8;box-shadow:inset 0 0 0 3px #f59e0b;font-weight:800}
table.ph td.noparts{color:var(--sub);text-align:left;font-weight:500}
table.ph tr.eqstart td{border-top:3px solid #475569}
table.ph tbody tr:first-child td{border-top:1px solid var(--grid)}
table.fixed{width:auto;min-width:0}
table.fixed td.d,table.fixed th.dh{width:112px;min-width:112px;max-width:112px}
table.ph td.in{min-width:52px}
.inbtn,.modal .inbtn{flex-shrink:0;min-width:38px;padding:0}
.legend{display:flex;gap:14px;align-items:center;color:var(--sub);font-size:12.5px;margin-top:10px;flex-wrap:wrap}
.legend b{display:inline-block;width:15px;height:15px;border-radius:3px;vertical-align:-2px;margin-right:4px}
.empty-state{padding:40px 10px;text-align:center;color:var(--sub);font-size:15px}
.soon{padding:60px 20px;text-align:center;color:var(--sub);font-size:15px}
.soon b{display:block;font-size:20px;color:#334155;margin-bottom:8px}

/* ---------- 모달 (글자 크게) ---------- */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .12s}
@keyframes fade{from{opacity:0}}
.modal{background:#fff;border-radius:14px;width:100%;max-width:520px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.3);font-size:15px}
.modal.wide{max-width:820px}
.modal button{font-size:14.5px;padding:9px 16px}
.modal button.sm{font-size:13.5px;padding:6px 12px}
.modal input,.modal select{font-size:15px;padding:10px 12px}
.mh{padding:15px 20px;border-bottom:1px solid var(--line2);font-weight:800;font-size:17px;display:flex;align-items:center}
.mh .x{margin-left:auto;border:none;font-size:20px;padding:0 6px;color:var(--sub);background:none}
.mb{padding:18px 20px;overflow:auto}
.mf{padding:13px 20px;border-top:1px solid var(--line2);display:flex;gap:8px;justify-content:flex-end}
.mf .left{margin-right:auto}
.fld{margin-bottom:14px}
.fld>label{display:block;font-size:14px;font-weight:700;color:#334155;margin-bottom:6px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row input[type=text],.row input:not([type]){flex:1;min-width:130px}
.hint{font-size:13.5px;color:var(--sub);margin-top:6px;min-height:18px}
.hint.err{color:var(--danger)}
.hint.okk{color:#15803d}
.target{background:#f1f5f9;border:1px solid var(--line);border-radius:8px;padding:11px 14px;font-weight:800;font-size:16px;margin-bottom:16px;color:#1e293b}
.seg{display:flex;gap:8px}
.modal .seg button{flex:1;padding:11px;font-weight:800;font-size:15.5px}
.seg button.on[data-t="교체"]{background:var(--rep);border-color:#4ade80;color:var(--rep-t);box-shadow:inset 0 0 0 1.5px #4ade80}
.seg button.on[data-t="CLN"]{background:var(--cln);border-color:#60a5fa;color:var(--cln-t);box-shadow:inset 0 0 0 1.5px #60a5fa}
.sec{margin-bottom:20px}
.sec h4{margin:0 0 10px;font-size:15px;color:#1e293b;font-weight:800}
table.mini{border-collapse:collapse;width:100%;font-size:15px}
table.mini td,table.mini th{border-bottom:1px solid var(--line2);padding:6px 5px;text-align:left}
table.mini th{font-size:13.5px;color:var(--sub);font-weight:700}
table.mini input,table.mini select{width:100%}
table.mini tr.grp td{background:#f1f5f9;font-weight:800;font-size:14px;color:#334155;padding:7px 10px;border-top:2px solid #cbd5e1}
td.drag{width:30px;cursor:grab;color:#94a3b8;font-size:20px;text-align:center;user-select:none}
td.drag:hover{color:var(--pri)}
tr.dragging{opacity:.45;background:#eef4ff}
.hlist{border:1px solid var(--line);border-radius:10px;max-height:300px;overflow:auto}
.hlist .hi{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line2)}
.hlist .hi:last-child{border-bottom:none}
.hlist .hi .v{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;padding:3px 10px;border-radius:6px}
.hlist .hi .v.rep{background:var(--rep);color:var(--rep-t)}
.hlist .hi .v.cln{background:var(--cln);color:var(--cln-t)}
.hlist .hi .no{color:var(--sub);font-size:13px;width:26px}
.hlist .hi .sp{flex:1}
.hlist .hi.editing{background:#fff7e0}
.hlist .empty{padding:14px;color:var(--sub);text-align:center}
.editbar{background:#fff7e0;border:1px solid #fcd34d;border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:14px;font-weight:700;color:#92400e;display:flex;align-items:center;gap:8px}
.note{font-size:13px;color:var(--sub);line-height:1.65}
.modal textarea{width:100%;min-height:150px;font-family:Consolas,"D2Coding",monospace;font-size:13.5px;border:1px solid var(--line);border-radius:8px;padding:10px;outline:none;resize:vertical;white-space:pre;overflow:auto}
.modal textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-soft)}
.ipv{border:1px solid var(--line);border-radius:10px;max-height:320px;overflow:auto}
.ipv table{border-collapse:collapse;width:100%;font-size:13.5px}
.ipv th{position:sticky;top:0;background:#f1f5f9;text-align:left;padding:7px 8px;font-size:12.5px;color:#334155;border-bottom:1px solid var(--line)}
.ipv td{padding:6px 8px;border-bottom:1px solid var(--line2);vertical-align:top}
.ipv td.ds{font-variant-numeric:tabular-nums;white-space:normal;line-height:1.7}
.ipv .chip2{display:inline-block;padding:0 6px;border-radius:5px;margin:1px 3px 1px 0;font-weight:700;font-size:12.5px;background:var(--rep);color:var(--rep-t)}
.ipv .chip2.cln{background:var(--cln);color:var(--cln-t)}
.ipv .chip2.dup{background:#f1f5f9;color:#94a3b8;text-decoration:line-through}
.ipv tr.bad td{background:#fef2f2}
.ipv .st-ok{color:#15803d;font-weight:700}.ipv .st-bad{color:var(--danger);font-weight:700}.ipv .st-new{color:#b45309;font-weight:700}
.isum{margin:10px 0 0;font-size:14.5px;font-weight:700}
.opts{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;font-size:14px}
.opts label{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.opts input[type=checkbox]{width:18px;height:18px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:11px 20px;border-radius:10px;font-size:14px;z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:fade .15s;max-width:90vw}
.toast.err{background:#b91c1c}
@media (max-width:640px){header{padding:10px 12px}.sync{margin-left:0;width:100%}.cats,main{padding-left:10px;padding-right:10px}.cat{flex:1;padding:9px 6px;font-size:13px}}
</style>
</head>
<body>

<header>
  <h1>파트 이력 관리 시스템</h1>
  <div class="sync" id="sync" data-s="local" title="클릭하면 연동 설정">
    <span class="light"><i class="r"></i><i class="y"></i><i class="g"></i></span>
    <span id="syncText">준비 중…</span>
  </div>
  <button class="hbtn" id="btnSettings">⚙ 설정</button>
</header>

<nav class="cats" id="cats">
  <button class="cat" data-cat="pm">PM Part</button>
  <button class="cat" data-cat="cryo">Cryo Pump</button>
  <button class="cat" data-cat="gas">Gas Bottle</button>
  <button class="cat" data-cat="pending">Pending</button>
</nav>

<main>
  <!-- PM Part -->
  <section id="sec-pm">
    <div class="card">
      <div class="toolbar">
        <button data-do="eq">🛠 설비 추가/제거</button>
        <button data-do="parts">📋 부위/항목 관리</button>
        <button data-do="old">🕘 예전 이력 보기</button>
        <button data-do="import">📥 엑셀 붙여넣기</button>
        <span class="info" data-info></span>
      </div>
      <div class="eqgroups"></div>
    </div>
    <div class="tablearea"></div>
    <div class="legend">
      <span><b style="background:#fff1a8;box-shadow:inset 0 0 0 2px #f59e0b"></b>가장 최근</span>
      <span><b style="background:var(--rep);border:1px solid #86efac"></b>교체 (YYMMDD)</span>
      <span><b style="background:var(--cln);border:1px solid #93c5fd"></b>CLN (YYMMDD CLN)</span>
      <span>· 입력 칸의 🖱 버튼을 눌러 이력 추가/수정/삭제</span>
    </div>
  </section>

  <!-- Cryo Pump -->
  <section id="sec-cryo" hidden>
    <div class="card">
      <div class="toolbar">
        <button data-do="eq">🛠 설비 추가/제거</button>
        <button data-do="pumps">🔧 Pump 추가/제거</button>
        <button data-do="old">🕘 예전 이력 보기</button>
        <button data-do="import">📥 엑셀 붙여넣기</button>
        <span class="info" data-info></span>
      </div>
      <div class="eqgroups"></div>
    </div>
    <div class="tablearea"></div>
    <div class="legend">
      <span><b style="background:#fff1a8;box-shadow:inset 0 0 0 2px #f59e0b"></b>가장 최근</span>
      <span>· 입력 칸의 🖱 버튼을 눌러 이력 추가/수정/삭제</span>
    </div>
  </section>

  <section id="sec-gas" hidden><div class="card soon"><b>Gas Bottle</b>다음 단계에서 구성 예정입니다.</div></section>
  <section id="sec-pending" hidden><div class="card soon"><b>Pending</b>다음 단계에서 구성 예정입니다.</div></section>
</main>

<script>
/* =====================================================================
   ① 기본 연동 설정 — 사내 GitHub 정보로 한 번만 바꿔두면
      동료들은 ⚙설정에서 "토큰"만 넣으면 됩니다.
   ===================================================================== */
const DEFAULT_CONFIG = {
  apiBase: 'https://api.github.com',   // 사내 GitHub이면 예: 'https://github.회사주소/api/v3'
  owner:   '',                         // 저장소 주인(사용자명 또는 조직명)
  repo:    '',                         // 저장소 이름
  branch:  'main',                     // 브랜치
  profile: 'default',                  // 명명법(프로필) → data/equipment_프로필.json, data/history_프로필.json
  pollSec: 10                          // 몇 초마다 다른 사람 변경사항 확인할지
};

/* =====================================================================
   공통 유틸
   ===================================================================== */
const LS = 'partHistory.';
function lsGet(k, d){ try{ const v = localStorage.getItem(LS+k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem(LS+k, JSON.stringify(v)); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(LS+k); }catch(e){} }
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const pad = n => String(n).padStart(2, '0');
const hhmmss = (d=new Date()) => `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
const todayYMD = () => { const d = new Date(); return `${pad(d.getFullYear()%100)}${pad(d.getMonth()+1)}${pad(d.getDate())}`; };
const uid = p => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const natural = (a,b) => String(a).localeCompare(String(b), 'ko', {numeric:true, sensitivity:'base'});
const byName = (a,b) => natural(a.name, b.name);
const partKey = p => `${p.area}|${p.item}`;
const CLICK_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M10 10l9.5 3.6-4.1 1.6-1.6 4.1z" fill="currentColor"/><path d="M15.4 15.2l3.6 3.6"/><path d="M7.5 2.8v2.6M2.8 7.5h2.6M4.2 4.2l1.8 1.8M10.8 4.2L9 6"/></svg>`;

/* 날짜 입력 → YYMMDD (YYMMDD, YY.MM.DD, YY-MM-DD, YY/MM/DD, YYYYMMDD, YYYY-MM-DD 모두 허용) */
function normDate(s){
  s = String(s||'').trim();
  if(!s) return null;
  let y, m, d;
  if(/[.\-\/\s]/.test(s)){
    const p = s.split(/[.\-\/\s]+/).filter(Boolean);
    if(p.length !== 3 || p.some(x => !/^\d+$/.test(x))) return null;
    [y, m, d] = p;
    if(y.length === 4) y = y.slice(2);
    if(y.length !== 2) return null;
  }else if(/^\d{6}$/.test(s)){ y = s.slice(0,2); m = s.slice(2,4); d = s.slice(4,6); }
  else if(/^\d{8}$/.test(s)){ y = s.slice(2,4); m = s.slice(4,6); d = s.slice(6,8); }
  else return null;
  m = +m; d = +d;
  const dt = new Date(2000 + +y, m-1, d);
  if(dt.getMonth() !== m-1 || dt.getDate() !== d) return null;
  return `${pad(+y)}${pad(m)}${pad(d)}`;
}
const ymdToIso = v => `20${v.slice(0,2)}-${v.slice(2,4)}-${v.slice(4,6)}`;
const isoToYmd = v => v ? v.slice(2,4)+v.slice(5,7)+v.slice(8,10) : '';
const entryText = e => e.t === 'CLN' ? `${e.d} CLN` : e.d;
const sameEntry = (a, b) => a.d === b.d && (a.t || '') === (b.t || '');
const sortEntries = arr => arr.sort((a,b) => b.d.localeCompare(a.d));   // 최신이 왼쪽

/* UTF-8 ↔ Base64 (한글 깨짐 방지) */
function b64enc(str){
  const bytes = new TextEncoder().encode(str); let bin = '';
  for(let i=0; i<bytes.length; i+=0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i+0x8000));
  return btoa(bin);
}
function b64dec(b64){
  const bin = atob(b64.replace(/\s/g,'')); const bytes = new Uint8Array(bin.length);
  for(let i=0; i<bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

/* =====================================================================
   설정
   ===================================================================== */
let cfg = Object.assign({}, DEFAULT_CONFIG, lsGet('cfg', {}));
const urlProfile = new URLSearchParams(location.search).get('profile');
if(urlProfile) cfg.profile = urlProfile;
if(!cfg.owner && /\.github\.io$/i.test(location.hostname)){         // github.io 주소면 자동 인식
  cfg.owner = location.hostname.split('.')[0];
  const seg = location.pathname.split('/').filter(Boolean)[0];
  if(seg && !/\.html?$/i.test(seg)) cfg.repo = seg;
}
/* API 주소 자동 보정: 사이트 주소(github.io)나 github.com을 넣어도 올바른 API 주소로 바꿔줌 */
function fixApi(s){
  s = String(s || '').trim();
  if(!s) return DEFAULT_CONFIG.apiBase;
  if(!/^https?:\/\//i.test(s)) s = 'https://' + s;
  let u; try{ u = new URL(s); }catch(e){ return s.replace(/\/+$/,''); }
  const host = u.hostname.toLowerCase();
  if(host === 'api.github.com' || host === 'github.com' || host === 'www.github.com' || host.endsWith('.github.io')) return 'https://api.github.com';
  if(/\/api\/v3/.test(u.pathname)) return u.origin + '/api/v3';
  return u.origin + '/api/v3';           // 사내 GitHub(Enterprise)
}
cfg.apiBase = fixApi(cfg.apiBase);
let token = lsGet('token', '');
let userName = lsGet('user', '');
const isRemote = () => !!(token && cfg.owner && cfg.repo);
const FILES = {
  eq:   () => `data/equipment_${cfg.profile}.json`,
  hist: () => `data/history_${cfg.profile}.json`
};
const EMPTY = {
  eq:   () => ({ profile: cfg.profile, prcList: ['HC_C','LE','HE','HVMS'], equipment: [], parts: {}, pumps: {}, updatedAt: null, updatedBy: '' }),
  hist: () => ({ version: 1, pm: {}, cryo: {}, updatedAt: null, updatedBy: '' })
};

/* =====================================================================
   저장소(백엔드) — GitHub API 또는 로컬(이 브라우저에만 저장)
   ===================================================================== */
function httpErr(status, text){ const e = new Error(`HTTP ${status}`); e.status = status; e.body = text; return e; }
async function ghMsg(r){ try{ const j = await r.clone().json(); return j.message ? `(${j.message})` : ''; }catch(e){ return ''; } }
function ghBodyMsg(e){ try{ const j = JSON.parse(e.body); return j.message || ''; }catch(_){ return ''; } }

const ghBackend = {
  url(path){
    return `${cfg.apiBase.replace(/\/+$/,'')}/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/${path.split('/').map(encodeURIComponent).join('/')}`;
  },
  headers(extra){ return Object.assign({ 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github+json' }, extra||{}); },
  async get(path){
    const q = `?ref=${encodeURIComponent(cfg.branch)}&_=${Date.now()}`;
    const r = await fetch(this.url(path) + q, { headers: this.headers(), cache: 'no-store' });
    if(r.status === 404) return null;
    if(!r.ok) throw httpErr(r.status, await r.text());
    const j = await r.json();
    let text;
    if(j.content && j.encoding === 'base64') text = b64dec(j.content);
    else { // 1MB 넘는 파일
      const r2 = await fetch(this.url(path) + q, { headers: this.headers({ 'Accept': 'application/vnd.github.raw' }), cache: 'no-store' });
      if(!r2.ok) throw httpErr(r2.status, await r2.text());
      text = await r2.text();
    }
    return { data: JSON.parse(text), sha: j.sha };
  },
  async put(path, obj, sha, message){
    const body = { message, content: b64enc(JSON.stringify(obj, null, 2) + '\n'), branch: cfg.branch };
    if(sha) body.sha = sha;
    const r = await fetch(this.url(path), { method: 'PUT', headers: this.headers({ 'Content-Type': 'application/json' }), body: JSON.stringify(body) });
    if(r.status === 409 || r.status === 422){ const e = new Error('conflict'); e.conflict = true; throw e; }
    if(!r.ok) throw httpErr(r.status, await r.text());
    const j = await r.json();
    return j.content.sha;
  }
};

const localBackend = {
  key: path => 'file:' + path,
  async get(path){
    const v = lsGet(this.key(path), null);
    if(v) return { data: v.data, sha: v.sha };
    try{ // 같은 폴더의 data/*.json 이 있으면 초기값으로 사용
      const r = await fetch(path, { cache: 'no-store' });
      if(r.ok){ const data = await r.json(); return { data, sha: 'seed' }; }
    }catch(e){}
    return null;
  },
  async put(path, obj, sha){
    const cur = lsGet(this.key(path), null);
    if(cur && sha && cur.sha !== sha){ const e = new Error('conflict'); e.conflict = true; throw e; }
    const nsha = 'L' + Date.now().toString(36) + Math.random().toString(36).slice(2,5);
    lsSet(this.key(path), { data: obj, sha: nsha });
    return nsha;
  }
};
const backend = () => isRemote() ? ghBackend : localBackend;

/* =====================================================================
   동기화 엔진
   - remote: 서버에 저장된 마지막 데이터
   - pending: 아직 저장 중인 내 작업(함수)
   - view: remote + pending → 화면에 보이는 데이터
   저장 충돌(동시 수정) 시 최신 데이터를 다시 받아 내 작업만 다시 적용 → 남의 수정 안 덮어씀
   ===================================================================== */
const store = {
  eq:   { remote: null, sha: null, pending: [], view: null },
  hist: { remote: null, sha: null, pending: [], view: null }
};
let saveQueue = Promise.resolve();
let saving = 0;
let pollTimer = null;
let lastChangeTime = null;

function rebuild(key){
  const s = store[key];
  const v = clone(s.remote);
  for(const op of s.pending){ try{ op.fn(v); }catch(e){ console.error(e); } }
  s.view = v;
}
async function reload(key){
  const r = await backend().get(FILES[key]());
  const s = store[key];
  const old = s.sha;
  if(r){ s.remote = r.data; s.sha = r.sha === 'seed' ? null : r.sha; }
  else { s.remote = EMPTY[key](); s.sha = null; }
  normalize(key, s.remote);
  return old !== s.sha;
}
/* 예전 json에 새 항목(pumps, cryo 등)이 없어도 자동으로 채워줌 */
function normalize(key, d){
  if(key === 'eq'){
    d.prcList = Array.isArray(d.prcList) ? d.prcList : [];
    d.equipment = Array.isArray(d.equipment) ? d.equipment : [];
    d.parts = d.parts && typeof d.parts === 'object' ? d.parts : {};
    d.pumps = d.pumps && typeof d.pumps === 'object' ? d.pumps : {};
    for(const p of d.prcList) if(!Array.isArray(d.parts[p])) d.parts[p] = [];
    for(const k in d.parts) for(const pt of d.parts[k]) if(!pt.id) pt.id = uid('p');
    for(const k in d.pumps) if(!Array.isArray(d.pumps[k])) d.pumps[k] = [];
  }else{
    d.pm = d.pm && typeof d.pm === 'object' ? d.pm : {};
    d.cryo = d.cryo && typeof d.cryo === 'object' ? d.cryo : {};
  }
}

/* 데이터 변경은 전부 commit() 으로 → 즉시 화면 반영 + 순서대로 저장 */
function commit(key, fn, msg){
  const s = store[key];
  const op = { fn, msg };
  s.pending.push(op);
  rebuild(key); render();
  saving++;
  saveQueue = saveQueue.then(() => flush(key, op)).catch(e => console.error(e)).finally(() => { saving--; });
  return saveQueue;
}
async function flush(key, op){
  const s = store[key];
  setStatus('busy', '저장 중…');
  let lastErr = null;
  for(let attempt = 0; attempt < 6; attempt++){
    try{
      const next = clone(s.remote);
      op.fn(next);
      next.updatedAt = new Date().toISOString();
      next.updatedBy = userName || '';
      const nsha = await backend().put(FILES[key](), next, s.sha, `[파트이력] ${op.msg}${userName ? ' - ' + userName : ''}`);
      s.remote = next; s.sha = nsha;
      s.pending.splice(s.pending.indexOf(op), 1);
      rebuild(key); render();
      markChanged('저장됨', userName);
      return;
    }catch(e){
      lastErr = e;
      if(e.conflict){ try{ await reload(key); }catch(_){} await sleep(300 + Math.random()*700); continue; }
      if(e.status === 401 || e.status === 403 || e.status === 404) break;   // 권한 문제는 재시도 의미 없음
      setStatus('err', `저장 실패 – 재시도 중… (${e.status ? 'HTTP ' + e.status : '네트워크'})`);
      await sleep(1500 * (attempt + 1));
    }
  }
  s.pending.splice(s.pending.indexOf(op), 1);
  rebuild(key); render();
  const why = lastErr && lastErr.status ? `${errText(lastErr.status)} ${ghBodyMsg(lastErr)}`.trim() : `네트워크 오류 (${lastErr ? lastErr.message : ''} · API 주소: ${cfg.apiBase})`;
  setStatus('err', `저장 실패 (${why})`);
  toast(`저장 실패: ${op.msg} — ${why}`, true);
}
function errText(st){
  if(st === 401) return '토큰 오류';
  if(st === 403) return '권한 없음/요청 한도';
  if(st === 404) return '저장소를 찾을 수 없음';
  return 'HTTP ' + st;
}

async function poll(){
  if(saving > 0 || document.hidden) return;
  try{
    const c1 = await reload('eq');
    const c2 = await reload('hist');
    if(saving > 0) return;
    rebuild('eq'); rebuild('hist');
    if(c1 || c2){
      render();
      const src = c2 ? store.hist.remote : store.eq.remote;
      markChanged('수정됨', src.updatedBy);
    }else if(curStatus !== 'changed'){
      setStatus(isRemote() ? 'ok' : 'local', baseOkText());
    }
  }catch(e){
    setStatus('err', e.status ? `연동 오류 (${errText(e.status)})` : '연결 끊김 – 재시도 중');
  }
}
function startPolling(){
  clearInterval(pollTimer);
  const sec = isRemote() ? Math.max(5, +cfg.pollSec || 10) : 3;
  pollTimer = setInterval(poll, sec * 1000);
}
document.addEventListener('visibilitychange', () => { if(!document.hidden) poll(); });

/* ---------- 신호등 상태 표시 ---------- */
let curStatus = 'local', statusTimer = null;
function baseOkText(){
  const last = lastChangeTime ? ` · 최근 변경 ${lastChangeTime}` : '';
  return isRemote() ? `실시간 연동 중${last}` : `로컬 모드 (GitHub 미설정)${last}`;
}
function setStatus(s, text){
  curStatus = s;
  const el = $('#sync'); el.dataset.s = s;
  $('#syncText').textContent = text;
}
function markChanged(word, by){
  lastChangeTime = hhmmss();
  setStatus('changed', `${lastChangeTime} ${word}${by ? ' (' + by + ')' : ''}`);
  clearTimeout(statusTimer);
  statusTimer = setTimeout(() => { if(curStatus === 'changed') setStatus(isRemote() ? 'ok' : 'local', baseOkText()); }, 6000);
}

/* =====================================================================
   카테고리 정의 (PM Part / Cryo Pump) — 표 구조만 다르고 동작은 같음
   ===================================================================== */
const EQ = () => store.eq.view;
const HIST = () => store.hist.view;
function allPrcs(){
  const list = [...EQ().prcList];
  for(const e of EQ().equipment) if(!list.includes(e.prc)) list.push(e.prc);
  return list;
}
const MODS = {
  pm: {
    hk: 'pm', cols: 10, hasType: true,
    heads: ['설비명', '부위', '항목'],
    prcs: () => allPrcs(),
    rows: eq => (EQ().parts[eq.prc] || []).map(p => ({ key: partKey(p), area: p.area, name: p.item, title: `${p.area} · ${p.item}` })),
    emptyRows: prc => `${prc}에 등록된 부위/항목이 없습니다 → 📋 부위/항목 관리에서 추가`
  },
  cryo: {
    hk: 'cryo', cols: 8, hasType: false,
    heads: ['설비 호기', 'Pump 명'],
    prcs: () => allPrcs().filter(p => Array.isArray(EQ().pumps[p])),
    rows: eq => (EQ().pumps[eq.prc] || []).map(n => ({ key: n, name: n, title: n })),
    emptyRows: prc => `${prc}에 등록된 Pump가 없습니다 → 🔧 Pump 추가/제거에서 추가`
  }
};
function eqOfPrc(prc){ return EQ().equipment.filter(e => e.prc === prc).sort(byName); }
function getEntries(hk, eqName, key){ const h = HIST()[hk] || {}; return (h[eqName] && h[eqName][key]) || []; }

/* =====================================================================
   화면 상태
   ===================================================================== */
const ui = {
  cat: lsGet('cat', 'pm'),
  sel: lsGet('sel2', {})       // { pm: {type:'eq',name} | {type:'prc',prc}, cryo: ... }
};
function selectedEquipment(cat){
  const mod = MODS[cat], prcs = mod.prcs();
  const eqs = EQ().equipment.filter(e => prcs.includes(e.prc));
  const sel = ui.sel[cat];
  if(sel && sel.type === 'eq' && eqs.some(e => e.name === sel.name)) return eqs.filter(e => e.name === sel.name);
  if(sel && sel.type === 'prc' && prcs.includes(sel.prc)) return eqOfPrc(sel.prc);
  for(const p of prcs){ const l = eqOfPrc(p); if(l.length){ ui.sel[cat] = { type: 'eq', name: l[0].name }; return [l[0]]; } }
  return [];
}

/* =====================================================================
   렌더링
   ===================================================================== */
function render(){
  if(!EQ() || !HIST()) return;
  document.querySelectorAll('.cat').forEach(b => b.classList.toggle('on', b.dataset.cat === ui.cat));
  ['pm','cryo','gas','pending'].forEach(c => $('#sec-' + c).hidden = c !== ui.cat);

          ? 'Pump가 등록된 PRC가 없습니다.<br><b>🔧 Pump 추가/제거</b> 버튼으로 Pump를 추가하세요.'
          : '등록된 설비가 없습니다.<br><b>🛠 설비 추가/제거</b> 버튼으로 설비를 추가하세요.'}</div>`;

function renderEqGroups(cat, box){
  const sel = ui.sel[cat] || {};
  let html = '';
  for(const prc of MODS[cat].prcs()){
    const list = eqOfPrc(prc);
    html += `<div class="prcgrp">
      <button class="prclabel ${sel.type==='prc' && sel.prc===prc ? 'on' : ''}" data-cat="${cat}" data-prc="${esc(prc)}" title="${esc(prc)} 전체 보기">${esc(prc)}</button>
      ${list.map(e => `<button class="eqbtn ${sel.type==='eq' && sel.name===e.name ? 'on' : ''}" data-cat="${cat}" data-eq="${esc(e.name)}">${esc(e.name)}</button>`).join('')}
      ${list.length ? '' : '<span class="note">설비 없음</span>'}
    </div>`;
  }
  box.innerHTML = html || '<div class="note">표시할 PRC가 없습니다.</div>';
}

function buildTable(cat, eqList, cols, fixed){
  const mod = MODS[cat];
  const nFix = mod.heads.length + 1;   // + 입력 칸
  let h = `<table class="ph ${fixed ? 'fixed' : ''}"><thead>
    <tr>${mod.heads.map(t => `<th rowspan="2">${t}</th>`).join('')}<th rowspan="2">입력</th><th colspan="${cols}">교체 일자 (최신 ←)</th></tr>
    <tr>${Array.from({length: cols}, (_, i) => `<th class="dh ${i===0 ? 'latest-h' : ''}">${i===0 ? '1 (최신)' : i+1}</th>`).join('')}</tr>
  </thead><tbody>`;
  for(const eq of eqList){
    const rows = mod.rows(eq);
    if(!rows.length){
      h += `<tr class="eqstart"><td class="eqn">${esc(eq.name)}</td><td colspan="${cols + nFix - 1}" class="noparts">${esc(mod.emptyRows(eq.prc))}</td></tr>`;
      continue;
    }
    rows.forEach((r, ri) => {
      const ents = getEntries(mod.hk, eq.name, r.key);
      h += `<tr class="${ri===0 ? 'eqstart' : ''}">`;
      if(ri === 0) h += `<td class="eqn" rowspan="${rows.length}">${esc(eq.name)}</td>`;
      if(cat === 'pm' && (ri === 0 || rows[ri-1].area !== r.area)){
        let span = 1; while(ri+span < rows.length && rows[ri+span].area === r.area) span++;
        h += `<td class="area" rowspan="${span}">${esc(r.area)}</td>`;
      }
      h += `<td class="item">${esc(r.name)}</td>`;
      h += `<td class="in"><button class="inbtn" title="이력 입력" data-cat="${cat}" data-eq="${esc(eq.name)}" data-key="${esc(r.key)}">${CLICK_ICON}</button></td>`;
      for(let i = 0; i < cols; i++){
        const e = ents[i];
        if(e) h += `<td class="d ${e.t==='CLN' ? 'cln' : 'rep'} ${i===0 ? 'latest' : ''}">${esc(entryText(e))}</td>`;
        else  h += `<td class="d"></td>`;
      }
      h += `</tr>`;
    });
  }
  return h + `</tbody></table>`;
}

function renderFullHist(cat, el){
  const list = selectedEquipment(cat), mod = MODS[cat];
  let max = mod.cols;
  for(const eq of list) for(const r of mod.rows(eq)) max = Math.max(max, getEntries(mod.hk, eq.name, r.key).length);
  const sl = el.querySelector('.tblwrap') ? el.querySelector('.tblwrap').scrollLeft : 0;
  el.innerHTML = list.length ? `<div class="tblwrap">${buildTable(cat, list, max, true)}</div>` : '<div class="empty-state">설비가 없습니다.</div>';
  const w = el.querySelector('.tblwrap'); if(w) w.scrollLeft = sl;
}

    const ents = getEntries(hk, eqName, key);
    el.querySelector('#enCount').textContent = `기록된 이력 (${ents.length}건 · 최신순)`;
    el.querySelector('#enList').innerHTML = ents.length ? ents.map((x, i) => `
      <div class="hi ${editing && sameEntry(editing, x) ? 'editing' : ''}" data-i="${i}">
        <span class="no">${i+1}</span>
        <span class="v ${x.t==='CLN' ? 'cln' : 'rep'}">${esc(entryText(x))}</span>
        <span class="sp"></span>
        <button class="sm" data-a="edit">수정</button>
        <button class="sm danger" data-a="del">삭제</button>
      </div>`).join('') : '<div class="empty">아직 기록이 없습니다.</div>';
  }
  function setEditing(x){
    editing = x;
    el.querySelector('#enEditBar').innerHTML = x ? `<div class="editbar">✏ 「${esc(entryText(x))}」 수정 중 <span style="flex:1"></span><button class="sm" id="enCancelEdit">수정 취소</button></div>` : '';
    el.querySelector('#enSave').textContent = x ? '수정 저장' : '추가';
    if(x){ setForm(x.d, x.t); el.querySelector('#enCancelEdit').onclick = () => { setEditing(null); setForm(todayYMD(), '교체'); }; }
    drawList();
  }

  dateEl.onchange = () => { txtEl.value = isoToYmd(dateEl.value); showHint(); };
  txtEl.oninput = showHint;
  txtEl.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); save(); } });
  el.querySelector('#enSave').onclick = save;
  el.querySelector('#enList').addEventListener('click', async e => {
    const b = e.target.closest('button[data-a]'); if(!b) return;
    const x = getEntries(hk, eqName, key)[+b.closest('.hi').dataset.i]; if(!x) return;
    if(b.dataset.a === 'edit'){ setEditing(clone(x)); txtEl.focus(); return; }
    if(!await confirmBox(`<b>${esc(eqName)} · ${esc(row.name)}</b><br>「${esc(entryText(x))}」 이력을 정말로 삭제할까요?`)) return;
    commit('hist', d => {
      const arr = d[hk] && d[hk][eqName] && d[hk][eqName][key]; if(!arr) return;
      const i = arr.findIndex(y => sameEntry(y, x)); if(i >= 0) arr.splice(i, 1);
    }, `${eqName} ${row.name} ${entryText(x)} 삭제`);
    if(editing && sameEntry(editing, x)){ setEditing(null); setForm(todayYMD(), '교체'); }
    toast('삭제했습니다'); drawList();
  });

  function save(){
    const v = normDate(txtEl.value);
    if(!v){ hint.className = 'hint err'; hint.textContent = '날짜를 확인해 주세요 (예: 260910 / 26.09.10)'; return; }
    const ne = mkEntry(mod, v, type);
    const ents = getEntries(hk, eqName, key);
    if(ents.some(x => sameEntry(x, ne) && !(editing && sameEntry(x, editing)))){ hint.className = 'hint err'; hint.textContent = '같은 날짜·구분의 기록이 이미 있습니다'; return; }
    if(editing){
      const old = editing;
      if(!sameEntry(old, ne)){
        commit('hist', d => {
          d[hk] = d[hk] || {}; d[hk][eqName] = d[hk][eqName] || {};
          const arr = d[hk][eqName][key] = d[hk][eqName][key] || [];
          const i = arr.findIndex(y => sameEntry(y, old));
          if(i >= 0) arr[i] = clone(ne); else arr.push(clone(ne));
          sortEntries(arr);
        }, `${eqName} ${row.name} ${entryText(old)} → ${entryText(ne)}`);
        toast(`수정: ${entryText(old)} → ${entryText(ne)}`);
      }
      setEditing(null); setForm(todayYMD(), '교체');
    }else{
      commit('hist', opAddEntry(hk, eqName, key, ne), `${eqName} ${row.name} ${entryText(ne)} 추가`);
      toast(`${eqName} · ${row.name} — ${entryText(ne)} 추가`);
      m.close();
    }
  }

  setForm(todayYMD(), '교체');
  drawList();
  setTimeout(() => { txtEl.focus(); txtEl.select(); }, 30);
}

/* =====================================================================
   📥 엑셀 붙여넣기 (기존 이력 한꺼번에 옮기기)
   지원하는 형태 (엑셀에서 범위 복사 → 붙여넣기):
     설비명 | 부위 | 항목 | 날짜 | 날짜 | ...      (PM Part)
     설비명 | Pump명 | 날짜 | 날짜 | ...           (Cryo Pump)
     항목 | 날짜 | 날짜 ...  (설비명 없으면 위에서 고른 기본 설비)
   - 병합된 셀(빈칸)은 위 행 값을 이어 씀
   - 날짜: 260910 / 26.09.10 / 2026-09-10 / 2026. 9. 10.
   - CLN: "260910 CLN", "260910 Clean", "260910 클린" → CLN, 나머지는 교체
   - 한 칸에 "260910 / 260530 CLN" 처럼 여러 날짜도 가능
   ===================================================================== */
function parseTable(text){
  text = String(text || '').replace(/\r\n?/g, '\n');
  let rows = [];
  if(text.includes('\t')){
    let row = [], cell = '', q = false;
    for(let i = 0; i < text.length; i++){
      const c = text[i];
      if(q){ if(c === '"'){ if(text[i+1] === '"'){ cell += '"'; i++; } else q = false; } else cell += c; }
      else if(c === '"' && cell === ''){ q = true; }
      else if(c === '\t'){ row.push(cell); cell = ''; }
      else if(c === '\n'){ row.push(cell); rows.push(row); row = []; cell = ''; }
      else cell += c;
    }
    if(cell !== '' || row.length){ row.push(cell); rows.push(row); }
  }else{
    // 탭이 없으면 " / " 또는 "|" 또는 칸 여러 개 띄우기로 구분
    rows = text.split('\n').map(l => l.split(/\s+\/\s+|\s*\|\s*|\s{2,}/));
  }
  return rows.map(r => r.map(x => x.trim())).filter(r => r.some(x => x));
}
const TYPE_RE = /\(?\s*(cln|clean|cleaning|클린|세정|교체|replace|rep)\s*\)?/ig;
function parseDateToken(tok){
  const t = String(tok || '').trim(); if(!t) return null;
  const type = /(cln|clean|클린|세정)/i.test(t) ? 'CLN' : '교체';
  const d = normDate(t.replace(TYPE_RE, ' ').replace(/\s+/g, ' ').trim().replace(/\.$/, ''));
  return d ? { d, t: type } : null;
}
function parseDateCell(cell){
  const out = { dates: [], bad: [] };
  for(const tok of String(cell || '').split(/\s+\/\s+|[,;\n]+/)){
    if(!tok.trim()) continue;
    const r = parseDateToken(tok);
    if(r) out.dates.push(r); else out.bad.push(tok.trim());
  }
  return out;
}
const isDateCell = c => { if(!c) return false; const r = parseDateCell(c); return r.dates.length > 0 && !r.bad.length; };
const lc = s => String(s || '').trim().replace(/\s+/g, ' ').toLowerCase();

function analyzeImport(cat, text, opt){
  const mod = MODS[cat];
  const rows = parseTable(text);
  const res = { rows: [], newEq: [], newParts: {}, newPumps: {}, total: 0, fresh: 0, errors: 0 };
  if(!rows.length) return res;
  // 이름 칸 개수(L) = 날짜가 처음 나오는 칸 위치의 최솟값
  let L = Infinity;
  for(const r of rows){ const i = r.findIndex(isDateCell); if(i >= 0) L = Math.min(L, i); }
  if(!isFinite(L)){ res.rows.push({ err: '날짜를 찾지 못했습니다' }); res.errors = 1; return res; }
  const eqByName = n => EQ().equipment.find(e => lc(e.name) === lc(n)) || res.newEq.find(e => lc(e.name) === lc(n));
  // PM에서 이름 칸이 2개면: 첫 칸이 설비명인지 부위인지 판단
  const firstIsEq = rows.some(r => r.slice(0, L).length && eqByName(r[0]));
  const prev = [];
  const seen = new Set();
  for(const r of rows){
    const di = r.findIndex(isDateCell);
    if(di < 0) continue;                     // 날짜 없는 행(제목 줄 등)은 건너뜀
    const labels = [];
    for(let j = 0; j < L; j++){ const v = (r[j] || '').trim(); labels[j] = v || prev[j] || ''; }
    labels.forEach((v, j) => prev[j] = v);
    let eqN = '', area = '', item = '';
    if(cat === 'pm'){
      if(L >= 3){ eqN = labels[L-3]; area = labels[L-2]; item = labels[L-1]; }
      else if(L === 2){ if(firstIsEq) eqN = labels[0]; else area = labels[0]; item = labels[1]; }
      else if(L === 1) item = labels[0];
    }else{
      if(L >= 2){ eqN = labels[L-2]; item = labels[L-1]; }
      else if(L === 1) item = labels[0];
    }
    const ents = [], bad = [];
    for(let j = L; j < r.length; j++){ const p = parseDateCell(r[j]); ents.push(...p.dates); bad.push(...p.bad); }
    const row = { eqLabel: eqN || opt.defEq || '', area, item, ents: ents.map(e => mkEntry(mod, e.d, e.t)), bad };
    res.rows.push(row);
    // 설비 찾기
    if(!row.eqLabel){ row.err = '설비명 없음 (위에서 기본 설비 선택)'; continue; }
    let eq = eqByName(row.eqLabel);
    if(!eq){
      if(opt.autoEq && opt.autoPrc){ eq = { name: row.eqLabel, prc: opt.autoPrc }; res.newEq.push(eq); row.newEq = true; }
      else { row.err = `등록 안 된 설비: ${row.eqLabel}`; continue; }
    }
    row.eq = eq.name;
    if(!item){ row.err = '항목명 없음'; continue; }
    // 항목/Pump 찾기
    if(cat === 'pm'){
      const parts = (EQ().parts[eq.prc] || []).concat(res.newParts[eq.prc] || []);
      let c = parts.filter(p => lc(p.item) === lc(item));
      if(area && c.length > 1) c = c.filter(p => lc(p.area) === lc(area));
      if(area && c.length === 1 && lc(c[0].area) !== lc(area)){
        const exact = parts.find(p => lc(p.area) === lc(area) && lc(p.item) === lc(item)); if(exact) c = [exact];
      }
      if(c.length > 1){ row.err = `「${item}」 이 여러 부위에 있음 → 부위 칸 필요`; continue; }
      if(!c.length){
        if(opt.autoItem){ const np = { id: uid('p'), area: area || '기타', item }; (res.newParts[eq.prc] = res.newParts[eq.prc] || []).push(np); c = [np]; row.newItem = true; }
        else { row.err = `${eq.prc}에 없는 항목: ${area ? area + ' / ' : ''}${item}`; continue; }
      }
      row.key = partKey(c[0]); row.title = `${c[0].area} · ${c[0].item}`;
    }else{
      const pumps = (EQ().pumps[eq.prc] || []).concat(res.newPumps[eq.prc] || []);
      let pn = pumps.find(n => lc(n) === lc(item));
      if(!pn){
        if(opt.autoItem){ pn = item; (res.newPumps[eq.prc] = res.newPumps[eq.prc] || []).push(pn); row.newItem = true; }
        else { row.err = `${eq.prc}에 없는 Pump: ${item}`; continue; }
      }
      row.key = pn; row.title = pn;
    }
    if(!row.ents.length){ row.err = '날짜 없음'; continue; }
    // 이미 있는 기록 / 붙여넣기 안에서 중복 표시
    const exist = getEntries(mod.hk, row.eq, row.key);
    row.ents.forEach(e => {
      const k = `${row.eq}\u0000${row.key}\u0000${e.d}\u0000${e.t || ''}`;
      e.dup = exist.some(x => sameEntry(x, e)) || seen.has(k);
      seen.add(k);
      res.total++; if(!e.dup) res.fresh++;
    });
  }
  res.errors = res.rows.filter(r => r.err).length;
  return res;
}

function openImportModal(cat){

  const eqOpts = allPrcs().map(p => {

    return `<optgroup label="${esc(p)}">${l.map(e => `<option value="${esc(e.name)}" ${e.name === defEq ? 'selected' : ''}>${esc(e.name)}</option>`).join('')}</optgroup>`;
  }).join('');
  const example = cat === 'pm'
    ? '설비명\t부위\t항목\t교체일자\t\t\nIAH3701\tBeamline\tAMU\t260910\t260530 CLN\t260417\n\tSource\tFilament\t260801\t\t'
    : '설비 호기\tPump 명\t일자\t\nIAH3701\tCP09\t260910\t250101\n\tCP10\t250814\t';
  let res = null;
  const m = openModal({
    title: `📥 엑셀 붙여넣기 — ${cat === 'pm' ? 'PM Part' : 'Cryo Pump'}`, wide: 'wide',
    body: `
      <div class="note" style="margin-bottom:12px">엑셀에서 표 범위를 복사(Ctrl+C)해서 아래 칸에 붙여넣기(Ctrl+V) 하세요. 제목 줄은 같이 복사해도 자동으로 건너뜁니다.<br>
        형태: <b>${cat === 'pm' ? '설비명 | 부위 | 항목 | 날짜…' : '설비 호기 | Pump 명 | 날짜…'}</b> — 앞쪽 칸(설비명${cat === 'pm' ? '·부위' : ''})은 없어도 됩니다. 병합된 칸은 윗줄 값을 이어 씁니다.</div>
      <div class="opts">
        <label>설비명 칸이 없을 때 쓸 기본 설비 <select id="ipDef"><option value="">(선택 안 함)</option>${eqOpts}</select></label>
        <label><input type="checkbox" id="ipAutoItem" checked> 목록에 없는 ${cat === 'pm' ? '항목은 자동 추가 (부위 칸이 없으면 「기타」)' : 'Pump는 자동 추가'}</label>
        <label><input type="checkbox" id="ipAutoEq"> 등록 안 된 설비는 자동 추가 → PRC <select id="ipPrc">${allPrcs().map(p => `<option>${esc(p)}</option>`).join('')}</select></label>
      </div>
      <textarea id="ipText" placeholder="${esc(example)}"></textarea>
      <div class="isum" id="ipSum"></div>
      <div class="ipv" id="ipPrev" style="margin-top:8px;display:none"></div>`,
    buttons: [
      { text: '취소' },
      { text: '업로드', cls: 'pri', onClick: () => doUpload() }
    ]
  });
  const el = m.el, upBtn = el.querySelector('.mf .pri');
  const opt = () => ({ defEq: el.querySelector('#ipDef').value, autoItem: el.querySelector('#ipAutoItem').checked,
                       autoEq: el.querySelector('#ipAutoEq').checked, autoPrc: el.querySelector('#ipPrc').value });
  function preview(){
    const text = el.querySelector('#ipText').value;
    const pv = el.querySelector('#ipPrev'), sum = el.querySelector('#ipSum');
    if(!text.trim()){ pv.style.display = 'none'; sum.textContent = ''; upBtn.disabled = true; upBtn.textContent = '업로드'; res = null; return; }
    res = analyzeImport(cat, text, opt());
    const nE = res.newEq.length, nI = Object.values(cat === 'pm' ? res.newParts : res.newPumps).reduce((a, b) => a + b.length, 0);
    sum.innerHTML = `새로 올라갈 이력 <span style="color:var(--pri)">${res.fresh}건</span>`
      + (res.total - res.fresh ? ` · 이미 있음/중복 ${res.total - res.fresh}건(건너뜀)` : '')
      + (res.errors ? ` · <span style="color:var(--danger)">오류 ${res.errors}줄(건너뜀)</span>` : '')
      + (nE ? ` · 새 설비 ${nE}대` : '') + (nI ? ` · 새 ${cat === 'pm' ? '항목' : 'Pump'} ${nI}개` : '');
    pv.style.display = '';
    pv.innerHTML = `<table><tr><th>#</th><th>설비</th><th>${cat === 'pm' ? '부위 · 항목' : 'Pump'}</th><th>날짜 (회색 = 이미 있음)</th><th>상태</th></tr>
      ${res.rows.slice(0, 500).map((r, i) => `<tr class="${r.err ? 'bad' : ''}"><td>${i+1}</td>
        <td>${esc(r.eq || r.eqLabel || '-')}${r.newEq ? ' <span class="st-new">(새 설비)</span>' : ''}</td>
        <td>${esc(r.title || [r.area, r.item].filter(Boolean).join(' · ') || '-')}${r.newItem ? ' <span class="st-new">(새로 추가)</span>' : ''}</td>
        <td class="ds">${(r.ents || []).map(e => `<span class="chip2 ${e.t === 'CLN' ? 'cln' : ''} ${e.dup ? 'dup' : ''}">${esc(entryText(e))}</span>`).join('')}${r.bad && r.bad.length ? `<br><span class="st-bad">인식 못 함: ${esc(r.bad.join(', '))}</span>` : ''}</td>
        <td>${r.err ? `<span class="st-bad">${esc(r.err)}</span>` : '<span class="st-ok">OK</span>'}</td></tr>`).join('')}</table>`;
    upBtn.disabled = !res.fresh;
    upBtn.textContent = res.fresh ? `${res.fresh}건 업로드` : '업로드';
  }
  el.querySelector('#ipText').addEventListener('input', preview);
  el.querySelectorAll('#ipDef, #ipAutoItem, #ipAutoEq, #ipPrc').forEach(x => x.addEventListener('change', preview));
  upBtn.disabled = true;
  setTimeout(() => el.querySelector('#ipText').focus(), 30);

  function doUpload(){
    if(!res || !res.fresh) return false;
    const r = res, hk = mod.hk;
    const newEq = r.newEq.filter(e => r.rows.some(x => !x.err && x.eq === e.name));
    const hasNew = newEq.length || Object.keys(r.newParts).length || Object.keys(r.newPumps).length;
    if(hasNew){
      commit('eq', d => {
        for(const e of newEq) if(!d.equipment.some(x => lc(x.name) === lc(e.name))) d.equipment.push({ name: e.name, prc: e.prc });
        for(const P in r.newParts){
          d.parts[P] = d.parts[P] || [];
          for(const np of r.newParts[P]){
            const a = d.parts[P];
            if(a.some(p => lc(p.area) === lc(np.area) && lc(p.item) === lc(np.item))) continue;
            let at = -1; a.forEach((p, i) => { if(p.area === np.area) at = i; });
            if(at >= 0) a.splice(at + 1, 0, np); else a.push(np);
          }
          if(!d.prcList.includes(P)) d.prcList.push(P);
        }
        for(const P in r.newPumps){
          d.pumps[P] = d.pumps[P] || [];
          for(const n of r.newPumps[P]) if(!d.pumps[P].some(x => lc(x) === lc(n))) d.pumps[P].push(n);
        }
      }, `엑셀 붙여넣기: 설비/항목 자동 추가`);
    }
    const items = [];
    for(const row of r.rows) if(!row.err) for(const e of row.ents) if(!e.dup) items.push({ eq: row.eq, key: row.key, e: mkEntry(mod, e.d, e.t) });
    commit('hist', d => {
      d[hk] = d[hk] || {};
      const touched = new Set();
      for(const it of items){
        d[hk][it.eq] = d[hk][it.eq] || {};
        const arr = d[hk][it.eq][it.key] = d[hk][it.eq][it.key] || [];
        if(!arr.some(x => sameEntry(x, it.e))) arr.push(clone(it.e));
        touched.add(arr);
      }
      touched.forEach(sortEntries);
    }, `엑셀 붙여넣기 ${items.length}건 (${cat === 'pm' ? 'PM Part' : 'Cryo Pump'})`);
    toast(`${items.length}건 업로드했습니다`);
  }
}

/* =====================================================================
   드래그 앤 드롭 (목록 순서 변경) — ⠿ 손잡이를 잡고 끌기
   ===================================================================== */
function makeSortable(tbody, onDrop){
  let dragEl = null;
  tbody.addEventListener('mousedown', e => { const h = e.target.closest('.drag'); if(h) h.closest('tr').draggable = true; });
  document.addEventListener('mouseup', () => { if(!dragEl) tbody.querySelectorAll('tr[draggable=true]').forEach(t => t.draggable = false); });
  tbody.addEventListener('dragstart', e => {
    dragEl = e.target.closest('tr[data-id]'); if(!dragEl) return;
    dragEl.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    try{ e.dataTransfer.setData('text/plain', dragEl.dataset.id); }catch(_){}
  });
  tbody.addEventListener('dragover', e => {
    if(!dragEl) return;
    e.preventDefault();
    const tr = e.target.closest('tr[data-id]'); if(!tr || tr === dragEl) return;
    const r = tr.getBoundingClientRect();
    tr.parentNode.insertBefore(dragEl, e.clientY > r.top + r.height / 2 ? tr.nextSibling : tr);
  });
  tbody.addEventListener('drop', e => e.preventDefault());
  tbody.addEventListener('dragend', () => {
    if(!dragEl) return;
    dragEl.classList.remove('dragging'); dragEl.draggable = false; dragEl = null;
    onDrop([...tbody.querySelectorAll('tr[data-id]')].map(t => t.dataset.id));
  });
}
function reorderBy(arr, ids, idOf){
  const pos = new Map(ids.map((id, i) => [id, i]));
  return [...arr].sort((a, b) => (pos.has(idOf(a)) ? pos.get(idOf(a)) : 1e9) - (pos.has(idOf(b)) ? pos.get(idOf(b)) : 1e9));
}

/* =====================================================================
   설비 추가/제거 (PM Part · Cryo Pump 공용)
   ===================================================================== */
function openEqModal(){
  const m = openModal({
    title: '🛠 설비 추가 / 수정 / 제거', wide: 'wide',
    body: `
      <div class="sec"><h4>설비 추가</h4>
        <div class="row"><input id="newEqName" placeholder="설비명 입력" autocomplete="off"><select id="newEqPrc"></select><button class="pri" id="addEq">추가</button></div>
        <div class="hint" id="eqHint"></div>
      </div>
      <div class="sec"><h4 id="eqCount">등록된 설비</h4><div id="eqList"></div></div>
      <div class="note">· 설비명을 바꾸면 기존 이력(PM Part·Cryo Pump)도 새 이름으로 옮겨집니다.<br>· 설비를 삭제해도 이력은 history 파일에 남아 있어서, 같은 이름으로 다시 추가하면 이력이 다시 보입니다.</div>`,
    buttons: [{ text: '닫기', cls: 'pri' }]
  });
  const el = m.el;
  const hint = el.querySelector('#eqHint');
  const prcOptions = sel => allPrcs().map(p => `<option ${p === sel ? 'selected' : ''}>${esc(p)}</option>`).join('');
  const exists = (name, except) => EQ().equipment.some(e => e.name.toLowerCase() === name.toLowerCase() && e.name !== except);
  const curSel = ui.sel[ui.cat];
  let lastPrc = curSel && curSel.type === 'prc' ? curSel.prc
              : ((EQ().equipment.find(e => curSel && e.name === curSel.name) || {}).prc || allPrcs()[0]);

  function draw(){
    el.querySelector('#newEqPrc').innerHTML = prcOptions(lastPrc);
    el.querySelector('#eqCount').textContent = `등록된 설비 (${EQ().equipment.length}) — PRC별`;
    let h = '';
    for(const prc of allPrcs()){
      const list = eqOfPrc(prc);
      h += `<tr class="grp"><td colspan="3">${esc(prc)} <span class="note">(${list.length}대)</span></td></tr>`;
      h += list.map(e => `<tr data-name="${esc(e.name)}"><td style="width:48%"><input class="en" value="${esc(e.name)}"></td><td style="width:24%"><select class="ep">${prcOptions(e.prc)}</select></td>
        <td style="white-space:nowrap;text-align:right"><button class="sm es">저장</button> <button class="sm danger ed">삭제</button></td></tr>`).join('')
        || `<tr><td colspan="3" class="note">설비 없음</td></tr>`;
    }
    el.querySelector('#eqList').innerHTML = `<table class="mini">${h}</table>`;
  }
  draw();
  el.querySelector('#newEqPrc').onchange = e => { lastPrc = e.target.value; };

  el.querySelector('#addEq').onclick = () => {
    const name = el.querySelector('#newEqName').value.trim(), prc = el.querySelector('#newEqPrc').value;
    if(!name){ hint.className = 'hint err'; hint.textContent = '설비명을 입력하세요'; return; }
    if(!prc){ hint.className = 'hint err'; hint.textContent = 'PRC가 없습니다 (equipment json의 prcList 확인)'; return; }
    if(exists(name)){ hint.className = 'hint err'; hint.textContent = '이미 있는 설비명입니다'; return; }
    commit('eq', d => { if(!d.equipment.some(e => e.name === name)) d.equipment.push({ name, prc }); }, `설비 추가 ${name}(${prc})`);
    hint.className = 'hint okk'; hint.textContent = `${name} (${prc}) 추가됨`;
    lastPrc = prc;
    el.querySelector('#newEqName').value = ''; el.querySelector('#newEqName').focus();
    draw();
  };
  el.querySelector('#newEqName').addEventListener('keydown', e => { if(e.key === 'Enter') el.querySelector('#addEq').click(); });

  el.querySelector('#eqList').addEventListener('click', async e => {
    const tr = e.target.closest('tr[data-name]'); if(!tr) return;
    const oldName = tr.dataset.name;
    if(e.target.classList.contains('es')){
      const name = tr.querySelector('.en').value.trim(), prc = tr.querySelector('.ep').value;
      if(!name){ toast('설비명을 입력하세요', true); return; }
      if(exists(name, oldName)){ toast('이미 있는 설비명입니다', true); return; }
      const cur = EQ().equipment.find(x => x.name === oldName);
      if(cur && cur.name === name && cur.prc === prc){ toast('변경사항 없음'); return; }
      commit('eq', d => { const x = d.equipment.find(q => q.name === oldName); if(x){ x.name = name; x.prc = prc; } }, `설비 수정 ${oldName} → ${name}(${prc})`);
      if(name !== oldName){
        commit('hist', d => {
          for(const hk of ['pm', 'cryo']){ const h = d[hk]; if(h && h[oldName] && !h[name]){ h[name] = h[oldName]; delete h[oldName]; } }
        }, `이력 설비명 변경 ${oldName} → ${name}`);
        for(const c in ui.sel){ const s = ui.sel[c]; if(s && s.type === 'eq' && s.name === oldName) s.name = name; }
        lsSet('sel2', ui.sel); render();
      }
      toast('저장했습니다'); draw();
    }else if(e.target.classList.contains('ed')){
      if(!await confirmBox(`설비 <b>${esc(oldName)}</b> 을(를) 정말로 삭제할까요?<br><span class="note">이력 기록은 파일에 남습니다.</span>`)) return;
      commit('eq', d => { d.equipment = d.equipment.filter(q => q.name !== oldName); }, `설비 삭제 ${oldName}`);
      toast(`${oldName} 삭제됨`); draw();
    }
  });
}

/* =====================================================================
   부위/항목 관리 (PM Part · PRC별) — 드래그로 순서 변경
   ===================================================================== */
function openPartsModal(){
  const s = ui.sel.pm;
  let prc = (s && s.type === 'prc') ? s.prc : (selectedEquipment('pm')[0] || {}).prc || allPrcs()[0];
  const m = openModal({
    title: '📋 부위 / 항목 관리', wide: 'wide',
    body: `
      <div class="fld"><label>PRC 선택</label><select id="ptPrc" style="min-width:200px"></select></div>
      <div class="sec"><h4>항목 추가</h4>
        <div class="row"><input id="ptArea" placeholder="부위 (예: Beamline)" autocomplete="off"><input id="ptItem" placeholder="항목 (예: AMU)" autocomplete="off"><button class="pri" id="ptAdd">추가</button></div>
      </div>
      <div class="sec"><h4 id="ptCount">항목 목록</h4><div id="ptList"></div></div>
      <div class="note">· <b>⠿</b> 손잡이를 잡고 위아래로 끌어서 순서를 바꿀 수 있습니다.<br>· 같은 부위끼리 붙어 있으면 표에서 부위 칸이 합쳐집니다.<br>· 이름을 바꾸면 기존 이력도 따라갑니다.</div>`,
    buttons: [{ text: '닫기', cls: 'pri' }]
  });
  const el = m.el;
  function draw(){
    el.querySelector('#ptPrc').innerHTML = allPrcs().map(p => `<option ${p === prc ? 'selected' : ''}>${esc(p)}</option>`).join('');
    const parts = EQ().parts[prc] || [];
    el.querySelector('#ptCount').textContent = `${prc} 항목 목록 (${parts.length})`;
    el.querySelector('#ptList').innerHTML = parts.length ? `<table class="mini"><thead><tr><th></th><th>부위</th><th>항목</th><th></th></tr></thead><tbody>
      ${parts.map(p => `<tr data-id="${esc(p.id)}"><td class="drag" title="끌어서 순서 변경">⠿</td><td><input class="pa" value="${esc(p.area)}"></td><td><input class="pi" value="${esc(p.item)}"></td>
        <td style="white-space:nowrap;text-align:right"><button class="sm ps">저장</button> <button class="sm danger px">삭제</button></td></tr>`).join('')}</tbody></table>`
      : '<div class="note">항목이 없습니다.</div>';
    const tb = el.querySelector('#ptList tbody');
    if(tb) makeSortable(tb, ids => {
      const P = prc, cur = (EQ().parts[P] || []).map(p => p.id);
      if(ids.join() === cur.join()) return;
      commit('eq', d => { d.parts[P] = reorderBy(d.parts[P] || [], ids, p => p.id); }, `${P} 항목 순서 변경`);
      draw();
    });
  }
  draw();
  el.querySelector('#ptPrc').onchange = e => { prc = e.target.value; draw(); };
  const eqNamesOf = p => EQ().equipment.filter(e => e.prc === p).map(e => e.name);

  el.querySelector('#ptAdd').onclick = () => {
    const area = el.querySelector('#ptArea').value.trim(), item = el.querySelector('#ptItem').value.trim();
    if(!area || !item){ toast('부위와 항목을 모두 입력하세요', true); return; }
    if(!prc){ toast('PRC가 없습니다', true); return; }
    if((EQ().parts[prc] || []).some(p => p.area === area && p.item === item)){ toast('이미 있는 항목입니다', true); return; }
    const id = uid('p'), P = prc;
    commit('eq', d => {
      d.parts[P] = d.parts[P] || [];
      const arr = d.parts[P];
      if(arr.some(p => p.area === area && p.item === item)) return;
      let at = -1; arr.forEach((p, i) => { if(p.area === area) at = i; });   // 같은 부위 뒤에 붙이기
      if(at >= 0) arr.splice(at + 1, 0, { id, area, item }); else arr.push({ id, area, item });
    }, `${P} 항목 추가 ${area}/${item}`);
    el.querySelector('#ptItem').value = ''; el.querySelector('#ptItem').focus();
    draw();
  };
  el.querySelector('#ptItem').addEventListener('keydown', e => { if(e.key === 'Enter') el.querySelector('#ptAdd').click(); });

  el.querySelector('#ptList').addEventListener('click', async e => {
    const tr = e.target.closest('tr[data-id]'); if(!tr || !e.target.matches('button')) return;
    const id = tr.dataset.id, P = prc;
    const cur = (EQ().parts[P] || []).find(p => p.id === id); if(!cur) return;
    if(e.target.classList.contains('ps')){
      const area = tr.querySelector('.pa').value.trim(), item = tr.querySelector('.pi').value.trim();
      if(!area || !item){ toast('부위와 항목을 모두 입력하세요', true); return; }
      if(area === cur.area && item === cur.item){ toast('변경사항 없음'); return; }
      if((EQ().parts[P] || []).some(p => p.id !== id && p.area === area && p.item === item)){ toast('이미 있는 항목입니다', true); return; }
      const oldKey = partKey(cur), newKey = `${area}|${item}`, names = eqNamesOf(P);
      commit('eq', d => { const x = (d.parts[P] || []).find(p => p.id === id); if(x){ x.area = area; x.item = item; } }, `${P} 항목 수정 ${oldKey} → ${newKey}`);
      commit('hist', d => { for(const n of names){ const h = d.pm[n]; if(h && h[oldKey] && !h[newKey]){ h[newKey] = h[oldKey]; delete h[oldKey]; } } }, `${P} 이력 항목명 변경 ${oldKey} → ${newKey}`);
      toast('저장했습니다'); draw();
    }else if(e.target.classList.contains('px')){
      if(!await confirmBox(`<b>${esc(P)}</b> 의 「${esc(cur.area)} / ${esc(cur.item)}」 항목을 정말로 삭제할까요?<br><span class="note">이력 기록은 파일에 남습니다.</span>`)) return;
      commit('eq', d => { d.parts[P] = (d.parts[P] || []).filter(p => p.id !== id); }, `${P} 항목 삭제 ${partKey(cur)}`);
      toast('삭제했습니다'); draw();
    }
  });
}

/* =====================================================================
   Pump 추가/제거 (Cryo Pump · PRC별) — 드래그로 순서 변경

function openPumpModal(){

      const P = prc;

      commit('eq', d => { d.pumps[P] = reorderBy(d.pumps[P] || [], ids, n => n); }, `${P} Pump 순서 변경`);
      draw();

    if(pumpsOf(prc).some(n => n.toLowerCase() === name.toLowerCase())){ hint.className = 'hint err'; hint.textContent = '이미 있는 Pump입니다'; return; }
    const P = prc;
    commit('eq', d => { d.pumps[P] = d.pumps[P] || []; if(!d.pumps[P].includes(name)) d.pumps[P].push(name); }, `${P} Pump 추가 ${name}`);

    el.querySelector('#pmName').value = ''; el.querySelector('#pmName').focus();

  el.querySelector('#pmName').addEventListener('keydown', e => { if(e.key === 'Enter') el.querySelector('#pmAdd').click(); });

  el.querySelector('#pmList').addEventListener('click', async e => {
    const tr = e.target.closest('tr[data-id]'); if(!tr || !e.target.matches('button')) return;
    const oldN = tr.dataset.id, P = prc;

      const name = tr.querySelector('.pn').value.trim();
      if(!name){ toast('Pump 명을 입력하세요', true); return; }
      if(name === oldN){ toast('변경사항 없음'); return; }
      if(pumpsOf(P).some(n => n !== oldN && n.toLowerCase() === name.toLowerCase())){ toast('이미 있는 Pump입니다', true); return; }
      const names = eqNamesOf(P);
      commit('eq', d => { const a = d.pumps[P] || []; const i = a.indexOf(oldN); if(i >= 0) a[i] = name; }, `${P} Pump 이름 변경 ${oldN} → ${name}`);
      commit('hist', d => { for(const n of names){ const h = d.cryo[n]; if(h && h[oldN] && !h[name]){ h[name] = h[oldN]; delete h[oldN]; } } }, `${P} Pump 이력 이름 변경 ${oldN} → ${name}`);
      toast('저장했습니다'); redraw();
    }else if(e.target.classList.contains('px')){
      if(!await confirmBox(`<b>${esc(P)}</b> 의 Pump 「${esc(oldN)}」 을(를) 정말로 삭제할까요?<br><span class="note">이력 기록은 파일에 남습니다.</span>`)) return;
      commit('eq', d => { d.pumps[P] = (d.pumps[P] || []).filter(n => n !== oldN); }, `${P} Pump 삭제 ${oldN}`);
      toast('삭제했습니다'); redraw();
    }
  });
}

/* =====================================================================
   설정 (GitHub 연동)
   ===================================================================== */
function openSettings(){
  const m = openModal({
    title: '⚙ 연동 설정', wide: 'wide',
    body: `
      <div class="fld"><label>내 이름 (변경 알림에 표시, 선택)</label><input id="sUser" value="${esc(userName)}" placeholder="예: 홍길동" style="width:100%"></div>
      <div class="fld"><label>GitHub 토큰 (Personal Access Token · 이 브라우저에만 저장)</label><input id="sToken" type="password" value="${esc(token)}" placeholder="ghp_... 또는 github_pat_..." style="width:100%" autocomplete="off"></div>
      <div class="fld"><label>API 주소</label><input id="sApi" value="${esc(cfg.apiBase)}" style="width:100%"><div class="hint">github.com → https://api.github.com &nbsp;/&nbsp; 사내 GitHub → https://사내주소/api/v3</div></div>
      <div class="row" style="margin-bottom:14px">
        <div style="flex:1"><label class="note"><b>Owner</b></label><input id="sOwner" value="${esc(cfg.owner)}" style="width:100%"></div>
        <div style="flex:1"><label class="note"><b>Repo</b></label><input id="sRepo" value="${esc(cfg.repo)}" style="width:100%"></div>
        <div style="flex:.6"><label class="note"><b>Branch</b></label><input id="sBranch" value="${esc(cfg.branch)}" style="width:100%"></div>
      </div>
      <div class="fld"><label>명명법(프로필)</label><input id="sProfile" value="${esc(cfg.profile)}" style="width:100%">
        <div class="hint">데이터 파일: data/equipment_<b>프로필</b>.json, data/history_<b>프로필</b>.json · 없는 프로필이면 처음 저장할 때 자동 생성</div></div>
      <div class="hint" id="sHint"></div>`,
    buttons: [
      { text: '토큰 지우기', cls: 'danger left', onClick: async () => {
          if(!await confirmBox('이 브라우저에 저장된 토큰을 정말로 지울까요?<br><span class="note">지우면 로컬 모드로 바뀝니다.</span>')) return false;
          token = ''; lsDel('token'); m.el.querySelector('#sToken').value = ''; await restart(); toast('토큰을 지웠습니다');
        } },
      { text: '연결 테스트', onClick: () => { test(); return false; } },
      { text: '저장 후 연결', cls: 'pri', onClick: async () => { apply(); await restart(); toast(isRemote() ? 'GitHub 연동을 시작합니다' : '로컬 모드로 동작합니다'); } }
    ]
  });
  const v = id => m.el.querySelector(id).value.trim();
  function apply(){
    userName = v('#sUser'); lsSet('user', userName);
    token = v('#sToken'); lsSet('token', token);
    cfg = Object.assign(cfg, { apiBase: fixApi(v('#sApi')), owner: v('#sOwner'), repo: v('#sRepo'), branch: v('#sBranch') || 'main', profile: v('#sProfile') || 'default' });
    lsSet('cfg', { apiBase: cfg.apiBase, owner: cfg.owner, repo: cfg.repo, branch: cfg.branch, profile: cfg.profile });
  }
  async function test(){
    const h = m.el.querySelector('#sHint');
    h.className = 'hint'; h.textContent = '확인 중…';
    try{
      const api = fixApi(v('#sApi')); m.el.querySelector('#sApi').value = api;
      const r = await fetch(`${api}/repos/${encodeURIComponent(v('#sOwner'))}/${encodeURIComponent(v('#sRepo'))}`,
        { headers: { 'Authorization': 'token ' + v('#sToken'), 'Accept': 'application/vnd.github+json' }, cache: 'no-store' });
      if(!r.ok){ h.className = 'hint err'; h.textContent = `실패: ${errText(r.status)} ${await ghMsg(r)}`; return; }
      const j = await r.json();
      const canWrite = j.permissions ? j.permissions.push : undefined;
      h.className = canWrite === false ? 'hint err' : 'hint okk';
      h.textContent = `연결 성공: ${j.full_name}` + (canWrite === false ? ' — 하지만 쓰기 권한이 없습니다' : ' (쓰기 가능)');
    }catch(e){ h.className = 'hint err'; h.textContent = '연결 실패: 주소를 확인하세요 (' + e.message + ')'; }
  }
}
async function restart(){
  store.eq.pending = []; store.hist.pending = [];
  setStatus('busy', '불러오는 중…');
  try{
    await reload('eq'); await reload('hist');
    rebuild('eq'); rebuild('hist'); render();
    setStatus(isRemote() ? 'ok' : 'local', baseOkText());
  }catch(e){
    if(!store.eq.remote){ store.eq.remote = EMPTY.eq(); store.eq.sha = null; }
    if(!store.hist.remote){ store.hist.remote = EMPTY.hist(); store.hist.sha = null; }
    rebuild('eq'); rebuild('hist'); render();
    setStatus('err', e.status ? `연동 오류 (${errText(e.status)})` : '연결 실패 – ⚙설정 확인');
  }
  startPolling();
}

/* =====================================================================
   모달 / 확인창 / 토스트
   ===================================================================== */
const modalStack = [];
function openModal({ title, body, buttons = [], wide }){
  const ov = document.createElement('div');
  ov.className = 'ov'; ov.style.zIndex = 100 + modalStack.length * 10;
  ov.innerHTML = `<div class="modal ${wide || ''}"><div class="mh">${title}<button class="x" title="닫기">✕</button></div>
    <div class="mb">${body}</div><div class="mf"></div></div>`;
  const mf = ov.querySelector('.mf');
  const api = { el: ov, close(){ ov.remove(); const i = modalStack.indexOf(api); if(i >= 0) modalStack.splice(i, 1); if(api.onClose) api.onClose(); } };
  buttons.forEach(b => {
    const btn = document.createElement('button');
    btn.textContent = b.text; if(b.cls) btn.className = b.cls;
    btn.onclick = async () => { const r = b.onClick ? await b.onClick() : undefined; if(r !== false) api.close(); };
    mf.appendChild(btn);
  });
  if(!buttons.length) mf.remove();
  ov.querySelector('.x').onclick = () => api.close();
  ov.addEventListener('mousedown', e => { ov._down = e.target === ov; });
  ov.addEventListener('click', e => { if(e.target === ov && ov._down) api.close(); ov._down = false; });
  document.body.appendChild(ov);
  modalStack.push(api);
  return api;
}
document.addEventListener('keydown', e => { if(e.key === 'Escape' && modalStack.length) modalStack[modalStack.length - 1].close(); });

function confirmBox(msg, okText = '삭제'){
  return new Promise(res => {
    let done = false;
    const m = openModal({
      title: '⚠ 확인',
      body: `<div style="line-height:1.7;font-size:15.5px">${msg}</div>`,
      buttons: [
        { text: '취소', onClick: () => { done = true; res(false); } },
        { text: okText, cls: 'pri', onClick: () => { done = true; res(true); } }
      ]
    });
    m.el.querySelector('.mf .pri').style.cssText = 'background:#dc2626;border-color:#dc2626';
    m.onClose = () => { if(!done) res(false); };
    setTimeout(() => m.el.querySelector('.mf button').focus(), 30);   // 기본 포커스는 '취소'
  });
}

let toastTimer = null;
function toast(msg, isErr){
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div');
  t.className = 'toast' + (isErr ? ' err' : ''); t.textContent = msg;
  document.body.appendChild(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), isErr ? 4000 : 2200);
}

/* =====================================================================
   시작
   ===================================================================== */
restart();
</script>
